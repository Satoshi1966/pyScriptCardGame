<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyScript 神経衰弱ゲーム</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.7.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.7.1/core.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header>
      <p class="eyebrow">PyScript MINI GAME</p>
      <h1>🃏 神経衰弱ゲーム</h1>
      <p class="lead">同じ絵柄のカードを2枚そろえよう！</p>
    </header>
    <section class="scoreboard" aria-label="ゲームの成績">
      <div><span>挑戦回数</span><strong id="turns">0</strong></div>
      <div><span>見つけたペア</span><strong id="pairs">0 / 6</strong></div>
      <div><span>ベスト記録</span><strong id="best">—</strong></div>
    </section>
    <p id="message" class="message" role="status" aria-live="polite">カードを2枚選んでください。</p>
    <section id="board" class="board" aria-label="カード一覧"></section>
    <button id="restart" class="restart" type="button">🔄 もう一度遊ぶ</button>
    <p class="note">※ 初回はPyScriptの読み込みに時間がかかる場合があります。</p>
  </main>
  <script type="py" src="./main.py"></script>
</body>
</html>
